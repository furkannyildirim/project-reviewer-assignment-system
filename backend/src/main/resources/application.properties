spring.application.name=reviewer-assignment-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=60m

app.jwt.issuer=reviewer-assignment-backend


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

project.file.storage.path=${PROJECT_FILE_STORAGE_PATH:./data/project-files}
project.file.storage.max-size=${PROJECT_FILE_MAX_SIZE:20MB}
project.file.storage.upload-ttl=${PROJECT_UPLOAD_TTL:24h}
project.upload.cleanup.interval=${PROJECT_UPLOAD_CLEANUP_INTERVAL:1h}
project.upload.cleanup.batch-size=${PROJECT_UPLOAD_CLEANUP_BATCH_SIZE:25}
spring.servlet.multipart.max-file-size=${PROJECT_FILE_MAX_SIZE:20MB}
spring.servlet.multipart.max-request-size=${PROJECT_FILE_MAX_REQUEST_SIZE:21MB}
